name: Import Book2Invest

on:
  push:
    paths:
      - book2invest-source.zip

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack repository
        run: |
          unzip -q book2invest-source.zip -d .
          rm book2invest-source.zip
          rm -f .github/workflows/import.yml

      - name: Commit imported files
        run: |
          git config user.name "book2invest-import[bot]"
          git config user.email "book2invest-import@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish Book2Invest skill"
          git push
